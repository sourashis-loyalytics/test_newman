name: PR Validation Demo

on:
  pull_request:
    branches:
      - main

jobs:
  postman-validation:
    name: Postman Validation
    runs-on: ubuntu-latest

    environment: qa

    env:
      MESSAGE_DATA: ${{ vars.MESSAGE_DATA }}
      MESSAGE_SUFFIX: ${{ vars.MESSAGE_SUFFIX }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - name: Install project dependencies
        run: npm install

      - name: Run validation
        run: npm run unit-test
